<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  :root {
    --dm-bg: #1a1a1a;
    --dm-bg-elevated: #242424;
    --dm-text: #e0e0e0;
    --dm-text-muted: #b0b0b0;
    --dm-link: #6db3f2;
    --dm-link-hover: #9ccbf5;
    --dm-border: #3a3a3a;
    --dm-code-bg: #2a2a2a;
  }

  /* Floating toggle button — top-right of viewport */
  #theme-toggle {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 9999;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  #theme-toggle:hover { transform: scale(1.08); }
  [data-theme="dark"] #theme-toggle {
    background: rgba(40, 40, 40, 0.9);
    color: #f5f5f5;
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  /* ---------- Dark theme overrides ---------- */
  [data-theme="dark"] body {
    background-color: var(--dm-bg) !important;
    color: var(--dm-text) !important;
  }

  /* Force readable text on every element. Excludes anchors/buttons (handled below) and SVG fills. */
  [data-theme="dark"] body,
  [data-theme="dark"] body p,
  [data-theme="dark"] body li,
  [data-theme="dark"] body span,
  [data-theme="dark"] body strong,
  [data-theme="dark"] body em,
  [data-theme="dark"] body b,
  [data-theme="dark"] body i,
  [data-theme="dark"] body small,
  [data-theme="dark"] body label,
  [data-theme="dark"] body dt,
  [data-theme="dark"] body dd,
  [data-theme="dark"] body figcaption,
  [data-theme="dark"] body h1,
  [data-theme="dark"] body h2,
  [data-theme="dark"] body h3,
  [data-theme="dark"] body h4,
  [data-theme="dark"] body h5,
  [data-theme="dark"] body h6 {
    color: var(--dm-text) !important;
  }

  /* Muted text */
  [data-theme="dark"] .page__meta,
  [data-theme="dark"] .page__date,
  [data-theme="dark"] .archive__item-excerpt,
  [data-theme="dark"] .archive__subtitle,
  [data-theme="dark"] .archive__item-info,
  [data-theme="dark"] .author__bio,
  [data-theme="dark"] blockquote,
  [data-theme="dark"] blockquote p,
  [data-theme="dark"] cite {
    color: var(--dm-text-muted) !important;
  }

  /* Backgrounds */
  [data-theme="dark"] .page,
  [data-theme="dark"] .page__content,
  [data-theme="dark"] .archive,
  [data-theme="dark"] .initial-content,
  [data-theme="dark"] .layout--single,
  [data-theme="dark"] .layout--archive,
  [data-theme="dark"] .layout--splash,
  [data-theme="dark"] .layout--home {
    background-color: var(--dm-bg) !important;
  }

  /* Links */
  [data-theme="dark"] a,
  [data-theme="dark"] a:visited,
  [data-theme="dark"] .page__content a,
  [data-theme="dark"] .archive__item-title a,
  [data-theme="dark"] .page__footer a,
  [data-theme="dark"] .author__urls li a {
    color: var(--dm-link) !important;
  }
  [data-theme="dark"] a:hover,
  [data-theme="dark"] a:focus {
    color: var(--dm-link-hover) !important;
  }

  /* Masthead */
  [data-theme="dark"] .masthead {
    background-color: var(--dm-bg-elevated) !important;
    border-bottom: 1px solid var(--dm-border) !important;
  }
  [data-theme="dark"] .greedy-nav { background-color: var(--dm-bg-elevated) !important; }
  [data-theme="dark"] .greedy-nav a { color: var(--dm-text) !important; }
  [data-theme="dark"] .greedy-nav a:hover { color: var(--dm-link-hover) !important; }
  [data-theme="dark"] .greedy-nav .visible-links a:before { background: var(--dm-link) !important; }
  [data-theme="dark"] .greedy-nav button {
    background-color: var(--dm-bg-elevated) !important;
    color: var(--dm-text) !important;
  }
  [data-theme="dark"] .greedy-nav .hidden-links {
    background: var(--dm-bg-elevated) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] .greedy-nav .hidden-links a { color: var(--dm-text) !important; }
  [data-theme="dark"] .greedy-nav .hidden-links a:hover { background: var(--dm-code-bg) !important; }
  [data-theme="dark"] .navicon,
  [data-theme="dark"] .navicon:before,
  [data-theme="dark"] .navicon:after { background: var(--dm-text) !important; }

  /* Sidebar / author */
  [data-theme="dark"] .sidebar,
  [data-theme="dark"] .author__content,
  [data-theme="dark"] .author__urls-wrapper {
    color: var(--dm-text) !important;
  }
  [data-theme="dark"] .author__urls {
    background-color: var(--dm-bg-elevated) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] .author__urls:before { border-bottom-color: var(--dm-border) !important; }
  [data-theme="dark"] .author__urls:after { border-bottom-color: var(--dm-bg-elevated) !important; }
  [data-theme="dark"] .author__urls li a { color: var(--dm-text) !important; }
  [data-theme="dark"] .author__urls li a:hover { color: var(--dm-link-hover) !important; }

  /* Code */
  [data-theme="dark"] pre,
  [data-theme="dark"] code,
  [data-theme="dark"] kbd,
  [data-theme="dark"] samp,
  [data-theme="dark"] tt,
  [data-theme="dark"] .highlight,
  [data-theme="dark"] div.highlighter-rouge,
  [data-theme="dark"] figure.highlight {
    background-color: var(--dm-code-bg) !important;
    color: var(--dm-text) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] pre code { background: transparent !important; }

  /* Blockquote */
  [data-theme="dark"] blockquote {
    border-left-color: var(--dm-border) !important;
  }

  /* Tables */
  [data-theme="dark"] table { border-color: var(--dm-border) !important; }
  [data-theme="dark"] th {
    background-color: var(--dm-bg-elevated) !important;
    border-color: var(--dm-border) !important;
    color: var(--dm-text) !important;
  }
  [data-theme="dark"] td { border-color: var(--dm-border) !important; }
  [data-theme="dark"] tr { background-color: var(--dm-bg) !important; }
  [data-theme="dark"] tr:nth-child(even) { background-color: var(--dm-bg-elevated) !important; }

  /* Footer */
  [data-theme="dark"] .page__footer,
  [data-theme="dark"] .page__footer-follow,
  [data-theme="dark"] .page__footer-copyright {
    background-color: var(--dm-bg-elevated) !important;
    color: var(--dm-text-muted) !important;
    border-top-color: var(--dm-border) !important;
  }
  [data-theme="dark"] .page__footer a { color: var(--dm-link) !important; }

  /* Borders, dividers */
  [data-theme="dark"] hr,
  [data-theme="dark"] .page__hero,
  [data-theme="dark"] .archive__item-teaser,
  [data-theme="dark"] .page__title { border-color: var(--dm-border) !important; }

  /* Notices */
  [data-theme="dark"] .notice,
  [data-theme="dark"] .notice--primary,
  [data-theme="dark"] .notice--info,
  [data-theme="dark"] .notice--warning,
  [data-theme="dark"] .notice--success,
  [data-theme="dark"] .notice--danger {
    background-color: var(--dm-bg-elevated) !important;
    color: var(--dm-text) !important;
  }

  /* Forms */
  [data-theme="dark"] input,
  [data-theme="dark"] textarea,
  [data-theme="dark"] select {
    background-color: var(--dm-bg-elevated) !important;
    color: var(--dm-text) !important;
    border-color: var(--dm-border) !important;
  }

  /* Pagination */
  [data-theme="dark"] .pagination a,
  [data-theme="dark"] .pagination li a {
    color: var(--dm-link) !important;
    border-color: var(--dm-border) !important;
  }

  /* TOC */
  [data-theme="dark"] .toc {
    background-color: var(--dm-bg-elevated) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] .toc .nav__title {
    background-color: var(--dm-code-bg) !important;
    color: var(--dm-text) !important;
  }
  [data-theme="dark"] .toc a { color: var(--dm-text) !important; }
  [data-theme="dark"] .toc a:hover { color: var(--dm-link-hover) !important; }
  [data-theme="dark"] .nav__list .nav__items,
  [data-theme="dark"] .nav__list .nav__items a { color: var(--dm-text) !important; }

  /* Images slightly dimmed in dark mode */
  [data-theme="dark"] img:not(.theme-icon) { opacity: 0.92; }
</style>

<script>
  // Inject the floating theme toggle and wire up persistence.
  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('theme-toggle')) return;
    var btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Toggle dark mode');
    btn.setAttribute('title', 'Toggle dark mode');
    function updateIcon() {
      var t = document.documentElement.getAttribute('data-theme');
      btn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    updateIcon();
    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      updateIcon();
    });
    document.body.appendChild(btn);

    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var handler = function(e) {
        try {
          if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            updateIcon();
          }
        } catch (err) {}
      };
      if (mq.addEventListener) mq.addEventListener('change', handler);
      else if (mq.addListener) mq.addListener(handler);
    }
  });
</script>
