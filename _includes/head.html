{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  :root {
    --dm-bg: #1a1a1a;
    --dm-bg-elevated: #242424;
    --dm-text: #e0e0e0;
    --dm-text-muted: #b0b0b0;
    --dm-link: #6db3f2;
    --dm-link-hover: #9ccbf5;
    --dm-border: #3a3a3a;
    --dm-code-bg: #2a2a2a;
  }
  [data-theme="dark"] body,
  [data-theme="dark"] .page__content,
  [data-theme="dark"] .page,
  [data-theme="dark"] .archive,
  [data-theme="dark"] .initial-content,
  [data-theme="dark"] .layout--single,
  [data-theme="dark"] .layout--archive {
    background-color: var(--dm-bg) !important;
    color: var(--dm-text) !important;
  }
  [data-theme="dark"] body { background-color: var(--dm-bg); color: var(--dm-text); }
  [data-theme="dark"] h1, [data-theme="dark"] h2, [data-theme="dark"] h3,
  [data-theme="dark"] h4, [data-theme="dark"] h5, [data-theme="dark"] h6,
  [data-theme="dark"] .page__title, [data-theme="dark"] .archive__item-title,
  [data-theme="dark"] .page__content h1, [data-theme="dark"] .page__content h2,
  [data-theme="dark"] .page__content h3, [data-theme="dark"] .page__content h4 {
    color: var(--dm-text) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] p, [data-theme="dark"] li, [data-theme="dark"] span,
  [data-theme="dark"] .page__meta, [data-theme="dark"] .archive__item-excerpt {
    color: var(--dm-text);
  }
  [data-theme="dark"] a { color: var(--dm-link); }
  [data-theme="dark"] a:hover, [data-theme="dark"] a:focus { color: var(--dm-link-hover); }
  [data-theme="dark"] .page__content a,
  [data-theme="dark"] .archive__item-title a { color: var(--dm-link); }
  [data-theme="dark"] .masthead {
    background-color: var(--dm-bg-elevated);
    border-bottom-color: var(--dm-border);
  }
  [data-theme="dark"] .greedy-nav { background-color: var(--dm-bg-elevated); }
  [data-theme="dark"] .greedy-nav a { color: var(--dm-text); }
  [data-theme="dark"] .greedy-nav a:hover { color: var(--dm-link-hover); }
  [data-theme="dark"] .greedy-nav .visible-links a:before { background: var(--dm-link); }
  [data-theme="dark"] .greedy-nav button { background-color: var(--dm-bg-elevated); color: var(--dm-text); }
  [data-theme="dark"] .sidebar,
  [data-theme="dark"] .author__avatar,
  [data-theme="dark"] .author__content,
  [data-theme="dark"] .author__urls-wrapper {
    color: var(--dm-text);
  }
  [data-theme="dark"] .author__name,
  [data-theme="dark"] .author__bio { color: var(--dm-text); }
  [data-theme="dark"] .author__urls { background-color: var(--dm-bg-elevated); border-color: var(--dm-border); }
  [data-theme="dark"] .author__urls li a { color: var(--dm-text); }
  [data-theme="dark"] .author__urls li a:hover { color: var(--dm-link-hover); }
  [data-theme="dark"] pre, [data-theme="dark"] code, [data-theme="dark"] kbd, [data-theme="dark"] samp {
    background-color: var(--dm-code-bg) !important;
    color: var(--dm-text) !important;
    border-color: var(--dm-border) !important;
  }
  [data-theme="dark"] blockquote {
    border-left-color: var(--dm-border);
    color: var(--dm-text-muted);
  }
  [data-theme="dark"] hr { border-color: var(--dm-border); }
  [data-theme="dark"] table { color: var(--dm-text); border-color: var(--dm-border); }
  [data-theme="dark"] th { background-color: var(--dm-bg-elevated); border-color: var(--dm-border); color: var(--dm-text); }
  [data-theme="dark"] td { border-color: var(--dm-border); }
  [data-theme="dark"] tr { background-color: var(--dm-bg); border-color: var(--dm-border); }
  [data-theme="dark"] tr:nth-child(even) { background-color: var(--dm-bg-elevated); }
  [data-theme="dark"] .page__footer,
  [data-theme="dark"] .page__footer-follow,
  [data-theme="dark"] .page__footer-copyright {
    background-color: var(--dm-bg-elevated) !important;
    color: var(--dm-text-muted) !important;
    border-top-color: var(--dm-border);
  }
  [data-theme="dark"] .page__footer a { color: var(--dm-link); }
  [data-theme="dark"] .archive__item-teaser { border-color: var(--dm-border); }
  [data-theme="dark"] .notice, [data-theme="dark"] .notice--primary,
  [data-theme="dark"] .notice--info, [data-theme="dark"] .notice--warning,
  [data-theme="dark"] .notice--success, [data-theme="dark"] .notice--danger {
    background-color: var(--dm-bg-elevated);
    color: var(--dm-text);
  }
  [data-theme="dark"] input, [data-theme="dark"] textarea, [data-theme="dark"] select {
    background-color: var(--dm-bg-elevated);
    color: var(--dm-text);
    border-color: var(--dm-border);
  }
  [data-theme="dark"] .pagination a,
  [data-theme="dark"] .pagination li a { color: var(--dm-link); border-color: var(--dm-border); }
  [data-theme="dark"] .toc { background-color: var(--dm-bg-elevated); border-color: var(--dm-border); }
  [data-theme="dark"] .toc .nav__title { background-color: var(--dm-code-bg); color: var(--dm-text); }
  [data-theme="dark"] .toc a { color: var(--dm-text); }
  [data-theme="dark"] .nav__list .nav__items { color: var(--dm-text); }
  [data-theme="dark"] .nav__list .nav__items a { color: var(--dm-text); }
  [data-theme="dark"] img { opacity: 0.9; }
  .theme-toggle {
    background: none !important;
    border: none;
    cursor: pointer;
    font-size: 1.1em;
    padding: 0 0.5em;
    line-height: 1;
    color: inherit;
  }
  .theme-toggle:hover { opacity: 0.7; }
</style>

<meta http-equiv="cleartype" content="on">
